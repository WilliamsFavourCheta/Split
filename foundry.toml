[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "artifacts/forge"
cache_path = "cache/forge"
libs = ["node_modules"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
remappings = ["v4-core/=node_modules/@uniswap/v4-core/src/"]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false
